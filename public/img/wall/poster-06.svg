<path class="spin" fill="#ffe45c" d="M582 584L585.52 596.48L598 600L585.52 603.52L582 616L578.48 603.52L566 600L578.48 596.48Z"/>
<rect width="640" height="640" fill="url(#dt)" pointer-events="none"/>
</svg>