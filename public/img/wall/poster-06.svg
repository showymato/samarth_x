<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .drift{animation:drift 7s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-40px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000" fill-opacity=".07"/></pattern></defs>
<rect width="640" height="640" fill="#12a150"/>

<text x="40" y="150" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.6999999999999997" font-size="60" fill="#fff">Clear the</text>
<text x="40" y="211.2" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.6999999999999997" font-size="60" fill="#fff">doubt today,</text>
<text x="40" y="272.4" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.6999999999999997" font-size="60" fill="#ffe45c">not in the</text>
<text x="40" y="333.6" font-family="Georgia, 'Times New Roman', serif"  font-style="italic"  font-size="64.80000000000001" fill="#ffe45c">exam hall.</text>
