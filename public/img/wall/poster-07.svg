<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .drift{animation:drift 7s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-40px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000" fill-opacity=".07"/></pattern></defs>
<rect width="640" height="960" fill="#ffe1ef"/>
<text x="40" y="110" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="4" fill="#1e1420" fill-opacity=".5">MON  <tspan fill="#ff4f9a" fill-opacity="1">TUE</tspan>  WED  THU  FRI</text>
<text x="40" y="250" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-3.51" font-size="78" fill="#1e1420">Toppers</text>
<text x="40" y="329.56" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-3.51" font-size="78" fill="#1e1420">aren’t made</text>
<text x="40" y="409.12" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-3.51" font-size="78" fill="#1e1420">on result day.</text>
<text x="40" y="488.68" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-3.51" font-size="78" fill="#ff4f9a">They’re made</text>
<text x="40" y="568.24" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-3.51" font-size="78" fill="#ff4f9a">on boring</text>
<text x="40" y="647.8" font-family="Georgia, 'Times New Roman', serif"  font-style="italic"  font-size="84.24000000000001" fill="#8b5cf6">Tuesdays.</text>
<rect class="blink" x="40" y="665.8" width="39" height="7.02" fill="#ff4f9a"/>

<text x="40" y="928" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="3" fill="#1e1420" fill-opacity=".6">THE WALL · POSTER 07 · 2026</text>
