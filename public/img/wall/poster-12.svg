<svg xmlns="http://www.w3.org/2000/svg" width="640" height="905" viewBox="0 0 640 905">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .drift{animation:drift 7s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-40px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000" fill-opacity=".07"/></pattern></defs>
<rect width="640" height="905" fill="#fbf5f6"/>
<circle class="pulse" cx="540" cy="120" r="54" fill="#ffb8dc" fill-opacity="0.7"/>
<text x="40" y="240" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.9699999999999998" font-size="66" fill="#1e1420">We are what we</text>
<text x="40" y="307.32" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.9699999999999998" font-size="66" fill="#1e1420">repeatedly do.</text>
<text x="40" y="374.64" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.9699999999999998" font-size="66" fill="#8b5cf6">Excellence,</text>
<text x="40" y="441.96000000000004" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.9699999999999998" font-size="66" fill="#8b5cf6">then, is not</text>
<text x="40" y="509.28000000000003" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-2.9699999999999998" font-size="66" fill="#8b5cf6">an act</text>
<text x="40" y="576.6" font-family="Georgia, 'Times New Roman', serif"  font-style="italic"  font-size="71.28" fill="#ff4f9a">but a habit.</text>
<rect class="blink" x="40" y="594.6" width="33" height="6" fill="#ff4f9a"/>
<text x="40" y="835" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#ff4f9a">— Will Durant</text>
<text x="40" y="873" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="3" fill="#1e1420" fill-opacity=".6">THE WALL · POSTER 12 · 2026</text>
<path class="spin" fill="#ff4f9a" d="M582 849L585.52 861.48L598 865L585.52 868.52L582 881L578.48 868.52L566 865L578.48 861.48Z"/>
<rect width="640" height="905" fill="url(#dt)" pointer-events="none"/>
</svg>