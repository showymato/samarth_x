<svg xmlns="http://www.w3.org/2000/svg" width="640" height="905" viewBox="0 0 640 905">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .drift{animation:drift 7s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-40px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#000" fill-opacity=".07"/></pattern></defs>
<rect width="640" height="905" fill="#1e1420"/>
<circle class="pulse" cx="520" cy="110" r="70" fill="#8b5cf6" fill-opacity="0.55"/>
<text x="40" y="230" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-4.05" font-size="90" fill="#fff">Motivation</text>
<text x="40" y="321.8" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-4.05" font-size="90" fill="#fff">gets you to</text>
<text x="40" y="413.6" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-4.05" font-size="90" fill="#fff">the desk.</text>
<text x="40" y="505.4" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-4.05" font-size="90" fill="#ffe45c">Small habits</text>
<text x="40" y="597.2" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"  letter-spacing="-4.05" font-size="90" fill="#ffe45c">keep you</text>
<text x="40" y="689" font-family="Georgia, 'Times New Roman', serif"  font-style="italic"  font-size="97.2" fill="#ffb8dc">there.</text>
